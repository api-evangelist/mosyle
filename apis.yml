apis:
- name: Mosyle Business API
  description: >-
    REST API for the Mosyle Business Apple device management platform. Requests
    are POSTed to operation endpoints under https://businessapi.mosyle.com/v1
    (e.g. listdevices, listusers) with a JSON body and an accessToken (JWT)
    credential. Lets IT teams inventory and act on managed Apple devices and
    users. Reference is provided to authenticated customers via the Mosyle
    Business admin console support area.
