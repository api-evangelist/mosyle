aid: mosyle
name: Mosyle
description: >-
  Mosyle is an Apple-focused unified endpoint management and endpoint security
  company that helps organizations deploy, manage, and protect Mac, iPhone,
  iPad, Apple TV, Apple Watch, and Vision Pro devices at work. Its cloud-native
  platform combines enterprise-grade Apple MDM, next-generation endpoint
  security (automated hardening & compliance, purpose-built Mac antivirus,
  AI-based automated Zero Trust, and Admin On-Demand privilege management),
  Apple-specific encrypted-DNS online privacy & security, macOS identity
  management & SSO (Mosyle Auth 2), and best-in-market apps & patch management.
  The Mosyle Business REST API (businessapi.mosyle.com/v1) lets IT teams
  programmatically query and act on managed devices and users using an
  accessToken (JWT) credential. Mosyle serves 65,000+ organizations worldwide.
